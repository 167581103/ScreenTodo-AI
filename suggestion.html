<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #5B8DEF;
    --accent-2: #3D5BD9;
    --accent-weak: rgba(91, 141, 239, 0.12);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #161618;
      --surface-2: #1F1F22;
      --border: rgba(255, 255, 255, 0.09);
      --shadow: 0 14px 44px rgba(0, 0, 0, 0.55);
      --title: #ECECEE;
      --text: #9B9BA1;
      --text-2: #6F6F76;
      --chip-bg: rgba(91, 141, 239, 0.14);
      --chip-fg: #8FB0F7;
      --ignore-bg: rgba(255, 255, 255, 0.06);
      --ignore-fg: #B4B4BA;
      --ignore-hover: rgba(255, 255, 255, 0.12);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --surface: #FFFFFF;
      --surface-2: #F4F4F6;
      --border: rgba(0, 0, 0, 0.08);
      --shadow: 0 14px 44px rgba(0, 0, 0, 0.16);
      --title: #141417;
      --text: #5C5C63;
      --text-2: #8A8A92;
      --chip-bg: rgba(61, 91, 217, 0.10);
      --chip-fg: #3D5BD9;
      --ignore-bg: #F1F1F4;
      --ignore-fg: #5C5C63;
      --ignore-hover: #E6E6EA;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 380px; height: auto; min-height: 160px; background: transparent; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #card {
    margin: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
    animation: slideIn 0.22s var(--ease);
  }
  @keyframes slideIn { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  #head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px 11px; border-bottom: 1px solid var(--border);
  }
  #chip {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--chip-bg); color: var(--chip-fg);
    display: grid; place-items: center;
  }
  #chip svg { width: 17px; height: 17px; }
  #htxt { font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: 0.01em; }

  #body { padding: 13px 16px 4px; overflow-y: auto; max-height: 420px; }
  #title { font-size: 15px; font-weight: 600; color: var(--title); line-height: 1.4; margin-bottom: 6px; }
  #reason { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 10px; }
  #ctx {
    font-size: 11.5px; color: var(--text-2); background: var(--surface-2);
    border-radius: 8px; padding: 7px 9px; line-height: 1.5;
    border-left: 2px solid var(--accent);
  }
  #ctx b { color: var(--text); font-weight: 600; }

  #actions { padding: 10px 16px 14px; display: flex; gap: 10px; }
  button {
    flex: 1; height: 42px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.14s var(--ease), transform 0.1s var(--ease);
  }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #add { background: var(--accent); color: #fff; }
  #add:hover { background: var(--accent-2); }
  #ignore { background: var(--ignore-bg); color: var(--ignore-fg); }
  #ignore:hover { background: var(--ignore-hover); }
</style>
</head>
<body>
  <div id="card">
    <div id="head">
      <div id="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0012 2z"/></svg>
      </div>
      <div id="htxt">发现一个可能的待办</div>
    </div>
    <div id="body">
      <div id="title">—</div>
      <div id="reason">—</div>
      <div id="ctx">—</div>
    </div>
    <div id="actions">
      <button id="ignore">忽略</button>
      <button id="add">添加待办</button>
    </div>
  </div>
<script>
  let current = null;
  window.orb.onSuggestion((item) => {
    current = item;
    document.getElementById('title').textContent = item.title || '未命名待办';
    document.getElementById('reason').textContent = item.reason || '';
    const ctx = document.getElementById('ctx');
    ctx.innerHTML = item.context ? ('<b>屏幕原文</b>　' + escapeHtml(item.context)) : '';
  });
  document.getElementById('add').addEventListener('click', () => { if (current) window.orb.addTodo(current); });
  document.getElementById('ignore').addEventListener('click', () => { if (current) window.orb.ignore(current); });
  // 20 秒无操作自动忽略
  setTimeout(() => { if (current) window.orb.ignore(current); }, 20000);

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
</script>
</body>
</html>
