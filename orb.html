<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #5B8DEF;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --orb-bg: rgba(26, 26, 28, 0.92);
      --orb-border: rgba(255, 255, 255, 0.10);
      --orb-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
      --glyph: #A9C2F5;
      --muted: #8A8A92;
      --menu-bg: rgba(26, 26, 28, 0.96);
      --menu-border: rgba(255, 255, 255, 0.10);
      --menu-hover: rgba(91, 141, 239, 0.16);
      --menu-text: #E6E6E9;
      --sep: rgba(255, 255, 255, 0.08);
      --badge-bg: #5B8DEF;
      --badge-text: #fff;
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --orb-bg: rgba(255, 255, 255, 0.92);
      --orb-border: rgba(0, 0, 0, 0.10);
      --orb-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
      --glyph: #3D5BD9;
      --muted: #6A6A70;
      --menu-bg: rgba(255, 255, 255, 0.97);
      --menu-border: rgba(0, 0, 0, 0.10);
      --menu-hover: rgba(61, 91, 217, 0.12);
      --menu-text: #1C1C1F;
      --sep: rgba(0, 0, 0, 0.08);
      --badge-bg: #3D5BD9;
      --badge-text: #fff;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 200px; height: 230px; background: transparent; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  #orb {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--orb-bg); border: 1px solid var(--orb-border);
    box-shadow: var(--orb-shadow);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    -webkit-app-region: drag; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.18s var(--ease), background 0.18s var(--ease);
  }
  #orb:hover { transform: translateX(-50%) scale(1.06); }
  #orb.paused { --glyph: var(--muted); }

  #pulse {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid var(--accent); opacity: 0.45;
    animation: pulse 2.4s ease-out infinite;
  }
  #orb.paused #pulse { display: none; }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.45; }
    100% { transform: scale(1.85); opacity: 0; }
  }

  #glyph { width: 28px; height: 28px; color: var(--glyph); -webkit-app-region: no-drag; pointer-events: none; }

  #badge {
    position: absolute; top: 16px; right: 56px;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--badge-bg); color: var(--badge-text);
    font: 600 11px/18px -apple-system, sans-serif; text-align: center; display: none;
  }

  #menu {
    position: absolute; top: 98px; left: 50%; transform: translateX(-50%);
    width: 176px; background: var(--menu-bg); border: 1px solid var(--menu-border);
    border-radius: 12px; padding: 6px; box-shadow: var(--orb-shadow);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    display: none; -webkit-app-region: no-drag;
  }
  #menu.show { display: block; animation: pop 0.16s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateX(-50%) translateY(-4px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  .mi {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px;
    border-radius: 8px; color: var(--menu-text); font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background 0.14s var(--ease);
  }
  .mi svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .mi:hover { background: var(--menu-hover); }
  .mi:hover svg { color: var(--accent); }
  .mi.danger:hover { background: rgba(229, 72, 77, 0.16); }
  .mi.danger:hover svg { color: #E5484D; }
  .sep { height: 1px; background: var(--sep); margin: 5px 8px; }
</style>
</head>
<body>
  <div id="orb" title="点击暂停 / 开启监听">
    <div id="pulse"></div>
    <span id="glyph"></span>
    <span id="badge">0</span>
  </div>
  <div id="menu">
    <div class="mi" id="mi-toggle"></div>
    <div class="sep"></div>
    <div class="mi" id="mi-stats"></div>
    <div class="sep"></div>
    <div class="mi" id="mi-ws">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      打开工作台
    </div>
    <div class="sep"></div>
    <div class="mi danger" id="mi-quit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      退出
    </div>
  </div>
<script>
  const orb = document.getElementById('orb');
  const glyph = document.getElementById('glyph');
  const badge = document.getElementById('badge');
  const menu = document.getElementById('menu');
  const miToggle = document.getElementById('mi-toggle');
  const miStats = document.getElementById('mi-stats');

  const ICON = {
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l12 7-12 7z"/></svg>',
    stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>',
  };

  let monitoring = true;

  orb.addEventListener('click', () => window.orb.toggleMonitor());
  // 右键菜单挂到整个窗口(document 级),避免只命中 64px 小球或被子拖拽区吞掉事件
  document.addEventListener('contextmenu', (e) => { e.preventDefault(); menu.classList.toggle('show'); });
  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && e.target !== orb && !orb.contains(e.target)) menu.classList.remove('show');
  });
  miToggle.addEventListener('click', () => { window.orb.toggleMonitor(); menu.classList.remove('show'); });
  document.getElementById('mi-ws').addEventListener('click', () => { window.orb.openWorkspace(); menu.classList.remove('show'); });
  document.getElementById('mi-quit').addEventListener('click', () => window.orb.quit());

  window.orb.onState((s) => {
    monitoring = s.monitoring;
    orb.classList.toggle('paused', !monitoring);
    glyph.innerHTML = monitoring ? ICON.eye : ICON.moon;
    miToggle.innerHTML = (monitoring ? ICON.pause : ICON.play) + (monitoring ? '暂停监听' : '开启监听');
    miStats.innerHTML = ICON.stats + `本次 ${s.stats.suggestions} 建议 · ${s.stats.added} 添加`;
    if (s.stats.suggestions > 0) { badge.style.display = 'block'; badge.textContent = s.stats.suggestions; }
    else badge.style.display = 'none';
  });
</script>
</body>
</html>
