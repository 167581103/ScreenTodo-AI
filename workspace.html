<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScreenTodo</title>
<style>
  :root{
    /* true-neutral cool surface — instrument, not lifestyle app */
    --bg:#FBFBFC;            /* page / content surface */
    --panel:#F4F5F7;         /* sidebar, second neutral layer */
    --raised:#FFFFFF;        /* raised elements: drawer, inputs */
    --line:#E9EAEE;          /* hairlines */
    --line-2:#DEE0E5;        /* stronger dividers */

    --ink:#1B1C1F;           /* primary text */
    --ink-2:#54565E;         /* secondary text — passes 4.5:1 on --bg */
    --ink-3:#7C7E87;         /* meta / captions — passes 4.5:1 on --bg */

    --accent:#4B5BD6;        /* indigo: selection, primary action, focus */
    --accent-ink:#3A47B0;    /* accent text on light */
    --accent-wash:#ECEEFB;   /* accent tint fill */
    --ok:#2E7D5B;            /* accepted */
    --ok-wash:#E4F1EA;
    --off:#B23A44;           /* ignored */
    --off-wash:#F7E7E8;

    --r-s:6px; --r-m:9px; --r-l:12px;
    --overlay-h:38px;
    --z-drawer:100; --z-drag:200;
    --e-out:cubic-bezier(.22,.61,.36,1);
  }
  /* 深色变量集:auto(跟随系统) + 显式 data-theme=dark 都套用 */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#151619; --panel:#1C1D21; --raised:#212328;
      --line:#2A2C31; --line-2:#34363C;
      --ink:#ECEDF0; --ink-2:#AEB0B8; --ink-3:#7E808A;
      --accent:#8A97F2; --accent-ink:#AAB4F6; --accent-wash:#25283A;
      --ok:#5FC79A; --ok-wash:#1E3329; --off:#E8848C; --off-wash:#3A2427;
    }
  }
  :root[data-theme="dark"]{
    --bg:#151619; --panel:#1C1D21; --raised:#212328;
    --line:#2A2C31; --line-2:#34363C;
    --ink:#ECEDF0; --ink-2:#AEB0B8; --ink-3:#7E808A;
    --accent:#8A97F2; --accent-ink:#AAB4F6; --accent-wash:#25283A;
    --ok:#5FC79A; --ok-wash:#1E3329; --off:#E8848C; --off-wash:#3A2427;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-size:14px;line-height:1.5;
  }
  ::selection{background:var(--accent-wash)}
  .drag-strip{position:fixed;top:0;left:0;right:0;height:var(--overlay-h);-webkit-app-region:drag;z-index:var(--z-drag)}
  .app{display:flex;height:100%;padding-top:var(--overlay-h)}

  /* ── sidebar ── */
  .sidebar{
    width:216px;flex:none;background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:14px 12px 12px;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px;-webkit-app-region:drag}
  .brand .mark{width:24px;height:24px;flex:none;display:block}
  .brand .mark .arc{stroke:var(--ink);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .brand .name{font-size:14px;font-weight:600;letter-spacing:-.01em}

  .nav-h{font-size:11px;font-weight:500;color:var(--ink-3);padding:8px 10px 4px}
  .tab{
    display:flex;align-items:center;gap:9px;height:34px;padding:0 12px;border-radius:12px;
    font-size:13px;font-weight:400;color:var(--ink-2);cursor:pointer;position:relative;
    transition:background .14s var(--e-out),color .14s var(--e-out);
    -webkit-app-region:no-drag;
  }
  .tab .lbl{flex:1}
  .tab .cnt{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-3);min-width:18px;text-align:right}
  .tab:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}
  /* 选中态:不用暗色块,靠 图标加粗 + 文字加粗 表达。固定 height 防加粗撑高。 */
  .tab.active{color:var(--ink);font-weight:600;background:none}
  .tab.active svg{stroke-width:2.4}
  .tab.active .cnt{color:var(--ink-2)}

  /* 侧栏带图标 tab(对话/设置)统一图标尺寸;设置 tab 推到最底部 */
  .tab svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;flex:none}
  .tab.view-tab{margin-top:auto}

  /* ── main ── */
  .main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;height:100%;overflow:hidden}
  /* 原生滚动条隐藏,改用 JS 自定义 overlay 滚动条(真正可动画) */
  .canvas{flex:1;overflow-y:auto;scrollbar-width:none}
  .canvas::-webkit-scrollbar{width:0;height:0}
  /* 自定义 overlay 滚动条:细→粗、淡→暗,普通元素上 transition 生效。
     整条 track 作为 hover 热区(而非只有 6px 的 thumb),悬停/拖拽时 thumb 变粗变暗。
     宽度以右边缘为锚(right 固定)向内增长,不移动 right → 动画平滑不跳。 */
  .vscroll{position:absolute;top:0;right:0;width:14px;pointer-events:none;z-index:6}
  .main:hover .vscroll{pointer-events:auto}                    /* 进内容区才接管热区,不挡点击 */
  .vscroll .thumb{
    position:absolute;right:3px;width:5px;border-radius:6px;
    background:var(--ink-3);opacity:.45;pointer-events:none;
    transition:width .18s var(--e-out),background-color .18s var(--e-out),opacity .22s var(--e-out);
  }
  .main:hover .vscroll .thumb{opacity:.7}                      /* 进区域:更清晰 */
  .vscroll.hot .thumb, .vscroll .thumb.drag{
    width:10px;opacity:1;background:var(--ink-2);              /* 悬到滚动条热区上:变粗+变暗 */
  }
  .vscroll .thumb.drag{background:var(--ink)}

  .head{padding:24px 32px 14px;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);z-index:2}
  .head h1{font-size:19px;font-weight:600;letter-spacing:-.02em}
  .head p{font-size:13px;color:var(--ink-2);margin-top:3px;max-width:64ch}

  /* ── feed (not cards — a clean list with hairline separation) ── */
  .feed{padding:0 20px 40px}
  .row{
    display:grid;grid-template-columns:1fr auto;gap:4px 14px;
    padding:14px 12px;border-radius:var(--r-m);cursor:pointer;position:relative;
    transition:background .14s var(--e-out);
  }
  .row + .row{box-shadow:0 -1px 0 var(--line)}
  .row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .row:hover + .row, .row.sel + .row{box-shadow:none}
  .row.sel{background:var(--accent-wash)}
  .row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .row .tt{font-size:14px;font-weight:500;color:var(--ink);line-height:1.4;letter-spacing:-.005em}
  .row .meta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;padding-top:1px}
  .row .ctx{
    grid-column:1;font-size:13px;color:var(--ink-2);line-height:1.5;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;
  }
  .row .ctx .src{color:var(--ink-3)}
  .row .flag{grid-column:2;grid-row:2;align-self:start}

  /* status pill — dot + text, quiet */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%}
  .pill.acc{color:var(--ok)} .pill.acc::before{background:var(--ok)}
  .pill.ign{color:var(--off)} .pill.ign::before{background:var(--off)}

  .empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:80px 24px;text-align:center;color:var(--ink-3)}
  .empty svg{width:26px;height:26px;stroke:var(--ink-3);stroke-width:1.4;fill:none;opacity:.7}
  .empty .t{font-size:14px;color:var(--ink-2)}
  .empty .s{font-size:12.5px;max-width:34ch;line-height:1.6}

  /* ── detail drawer ── */
  .scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 22%,transparent);opacity:0;pointer-events:none;transition:opacity .2s var(--e-out);z-index:calc(var(--z-drawer) - 1)}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{
    position:absolute;top:0;right:0;width:440px;max-width:82%;height:100%;
    background:var(--raised);border-left:1px solid var(--line-2);
    transform:translateX(100%);transition:transform .26s var(--e-out);
    display:flex;flex-direction:column;z-index:var(--z-drawer);
  }
  .drawer.open{transform:translateX(0)}
  .dh{padding:calc(var(--overlay-h) + 20px) 26px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
  .dh h2{font-size:17px;font-weight:600;line-height:1.35;letter-spacing:-.01em;flex:1;text-wrap:balance}
  .dclose{
    width:28px;height:28px;border-radius:var(--r-s);border:none;flex:none;cursor:pointer;
    background:transparent;color:var(--ink-3);display:flex;align-items:center;justify-content:center;
    transition:background .14s,color .14s;
  }
  .dclose:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
  .dclose svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none}
  .db{flex:1;overflow-y:auto;padding:22px 26px 32px;scrollbar-width:none}
  .db::-webkit-scrollbar{width:0;height:0}
  /* 详情抽屉复用同一套自定义 overlay 滚动条(.drawer 已是 position:absolute,天然作定位上下文) */
  .drawer:hover .vscroll{pointer-events:auto}
  .drawer:hover .vscroll .thumb{opacity:.7}

  .sec{margin-bottom:22px}
  .sec:last-child{margin-bottom:0}
  .sec .lbl{font-size:12px;font-weight:500;color:var(--ink-3);margin-bottom:8px}
  .sec .val{font-size:14px;color:var(--ink);line-height:1.6}
  .sec .val.mut{color:var(--ink-2)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;color:var(--ink-2);background:color-mix(in srgb,var(--ink) 6%,transparent);padding:3px 10px;border-radius:var(--r-s)}
  .rawbox{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
    padding:13px 15px;font-size:12.5px;color:var(--ink-2);line-height:1.7;
    font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;
  }
  /* 全局文本选择光标(功能性,到处一致):可选文本区统一 IBeam。氛围性的跟随小圈仅对话区。 */
  .row .tt,.db,.rawbox,.answer,.msg,.detail .kv,.stline{cursor:text}
  .stline{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500}
  .stline::before{content:"";width:8px;height:8px;border-radius:50%}
  .stline.acc{color:var(--ok)} .stline.acc::before{background:var(--ok)}
  .stline.ign{color:var(--off)} .stline.ign::before{background:var(--off)}
  .stline.pend{color:var(--ink-2)} .stline.pend::before{background:var(--ink-3)}

  /* ── 视图容器:feed 与 chat 两种主视图,互斥显示 ── */
  .view{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0}
  .view.hidden{display:none}

  /* ── 多会话管理器 ── */
  .chat-sec{padding:0 0 4px}
  .chat-sec-label{font-size:11px;font-weight:500;color:var(--ink-3);padding:8px 10px 4px;user-select:none}
  .session-list{display:flex;flex-direction:column;gap:3px;padding:0 4px}
  /* 会话项:R 角矩形(非全胶囊)。选中=文字加粗 + 很淡的底(列表需区分当前项,纯加粗不够)。固定高度防撑高。 */
  .session-item{position:relative;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:11px;cursor:pointer;font-size:12.5px;font-weight:400;color:var(--ink-2);transition:background .14s var(--e-out),color .14s var(--e-out)}
  .session-item:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}
  .session-item.active{color:var(--ink);font-weight:600;background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .session-item.dragging{opacity:.5;background:var(--panel);cursor:grabbing}
  /* 拖拽插入指示线:细 accent 线,靠伪元素画在项的上/下边缘 */
  .session-item.drop-above,.session-item.drop-below{overflow:visible}
  .session-item.drop-above::after,.session-item.drop-below::after{
    content:"";position:absolute;left:12px;right:10px;height:2px;border-radius:1px;background:var(--accent);pointer-events:none;
  }
  .session-item.drop-above::after{top:-2px}
  .session-item.drop-below::after{bottom:-2px}
  .session-item .ses-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* ... 菜单触发按钮:始终占位,靠 opacity/visibility 显隐(用 display 会改变行高→选中/hover 高度跳) */
  .ses-menu-btn{display:flex;align-items:center;justify-content:center;width:20px;height:20px;margin:-2px 0;border:none;border-radius:999px;background:transparent;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;letter-spacing:1px;flex:none;opacity:0;visibility:hidden;transition:color .1s,background .1s,opacity .12s}
  .session-item:hover .ses-menu-btn,.session-item.active .ses-menu-btn{opacity:1;visibility:visible}
  .ses-menu-btn:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent)}
  /* ... 弹出菜单(文本按钮) */
  .ses-menu{position:fixed;z-index:50;min-width:120px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;display:flex;flex-direction:column}
  .ses-menu button{display:block;width:100%;text-align:left;padding:7px 12px;border:none;background:none;border-radius:6px;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .1s}
  .ses-menu button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
  .ses-menu button.danger{color:var(--off)}
  .ses-menu button.danger:hover{background:var(--off-wash)}
  .session-new{display:flex;align-items:center;gap:4px;padding:7px 8px 7px 14px;margin-top:2px;border-radius:999px;cursor:pointer;font-size:11.5px;color:var(--ink-3);transition:color .12s,background .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
  .session-new:hover{color:var(--accent);background:color-mix(in srgb,var(--ink) 8%,transparent)}
  .ses-rename{border:none;background:transparent;font-size:12.5px;color:var(--ink);font-weight:inherit;line-height:inherit;width:100%;padding:0;margin:0;outline:none;font-family:inherit;box-shadow:inset 0 -1px 0 var(--accent)}
  .top-divider{height:1px;background:var(--line);margin:4px 8px 10px}

  /* ── 对话页面(默认主视图,整页) ── */
  .chat-page{position:relative;display:flex;flex-direction:column;height:100%;background:var(--bg);min-width:0}
  /* 对话区复用自定义 overlay 滚动条(同主列表:hover 变粗变暗,可动画) */
  .chat-page:hover .vscroll{pointer-events:auto}
  .chat-page:hover .vscroll .thumb{opacity:.7}
  .chat-body{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;position:relative}
  .chat-body::-webkit-scrollbar{width:0}
  /* 跟随鼠标的科技感小圈:灰/黑描边圆环,位置在 --mx/--my,平滑跟随 */
  .chat-glow{
    position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;
    border:1.5px solid color-mix(in srgb,var(--ink) 45%,transparent);
    background:transparent;
    transform:translate(-50%,-50%);pointer-events:none;z-index:5;opacity:0;
    transition:opacity .22s var(--e-out),
      width .18s var(--e-out),height .18s var(--e-out),
      border-radius .18s var(--e-out),border-width .18s var(--e-out),
      background-color .18s var(--e-out);
    will-change:left,top;
  }
  .chat-body:hover .chat-glow{opacity:.7}
  /* 悬停在可选文本上时:圆环形变为自定义 IBeam 文本选择光标(灰/黑,同一套语言) */
  .chat-glow.ibeam{
    width:4px;height:20px;border-radius:1px;
    border:1px solid color-mix(in srgb,var(--ink) 20%,transparent);
    border-top-width:0;border-bottom-width:0;
    background:color-mix(in srgb,var(--ink) 62%,transparent);
    opacity:.85;
  }
  /* IBeam 上下的衬线小横(经典 I 形),用伪元素画 */
  .chat-glow.ibeam::before,.chat-glow.ibeam::after{
    content:"";position:absolute;left:50%;width:9px;height:1.5px;
    transform:translateX(-50%);
    background:color-mix(in srgb,var(--ink) 62%,transparent);
    border-radius:1px;
  }
  .chat-glow.ibeam::before{top:-1px}
  .chat-glow.ibeam::after{bottom:-1px}
  .chat-glow.ibeam.selecting{opacity:1;background:var(--ink)}
  /* 隐藏可选文本区的原生光标,交给自定义 IBeam 呈现 */
  .chat-body:hover .answer,.chat-body:hover .msg{cursor:none}
  .chat-empty{color:var(--ink-3);font-size:13px;text-align:center;margin:auto;max-width:320px;line-height:1.6}
  /* 用户输入 = 气泡(右侧)。中性浅灰底、无边框;深色模式用半透明 ink 叠加自适应 */
  .msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .msg.u{align-self:flex-end;background:#F3F3F4;color:var(--ink);border-bottom-right-radius:5px}
  :root[data-theme=dark] .msg.u{background:color-mix(in srgb,var(--ink) 12%,transparent)}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]) .msg.u{background:color-mix(in srgb,var(--ink) 12%,transparent)}}
  /* 对话区选中高亮:用 accent 实色+白字,浅气泡/正文上都醒目(全局的 accent-wash 太淡看不清) */
  .chat-body .msg ::selection,.chat-body .msg::selection,
  .chat-body .answer ::selection,.chat-body .answer::selection{background:var(--accent);color:#fff}
  .thinking{align-self:flex-start;color:var(--ink-3);font-size:13px;padding:2px 2px 2px 4px;display:flex;align-items:center;gap:7px}
  .thinking::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:think-pulse 1s ease-in-out infinite}
  @keyframes think-pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

  /* Agent 输出 = playground:无气泡、无边框,全宽自由渲染的 markdown 内容区 */
  .answer{align-self:stretch;width:100%;color:var(--ink);font-size:13.5px;line-height:1.7;padding:2px 2px 6px}
  .answer.streaming::after{content:"▌";color:var(--ink-3);animation:caret .9s step-end infinite;margin-left:1px}
  @keyframes caret{50%{opacity:0}}
  .answer > *:first-child{margin-top:0}
  .answer > *:last-child{margin-bottom:0}
  .answer p{margin:0 0 10px;line-height:1.7}
  .answer h1,.answer h2,.answer h3{margin:16px 0 8px;line-height:1.3;font-weight:650;letter-spacing:-.01em}
  .answer h1{font-size:19px} .answer h2{font-size:16px} .answer h3{font-size:14.5px}
  .answer ul,.answer ol{margin:0 0 10px;padding-left:22px}
  .answer li{margin:3px 0;line-height:1.7}
  .answer li::marker{color:var(--ink-3)}
  .answer strong{font-weight:650;color:var(--ink)}
  .answer a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
  .answer code{font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:12.5px;background:color-mix(in srgb,var(--ink) 9%,transparent);padding:1.5px 6px;border-radius:6px}
  .answer pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
  .answer pre::-webkit-scrollbar{height:0}
  .answer pre code{background:none;padding:0;font-size:12.5px;line-height:1.65;white-space:pre}
  .answer blockquote{margin:0 0 10px;padding:4px 14px;border-left:3px solid var(--line-2);color:var(--ink-2)}
  .answer hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  .answer table{border-collapse:collapse;margin:0 0 12px;font-size:12.5px;width:100%}
  .answer th,.answer td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .answer th{background:color-mix(in srgb,var(--ink) 5%,transparent);font-weight:600}
  /* 工具调用指示 */
  /* 工具行:极简一行"它做了什么"——无卡片、无边框,一行灰字。点 chev 才展开细节。 */
  .tool-line{align-self:flex-start;max-width:92%;font-size:12px;color:var(--ink-3);margin:1px 0}
  .tool-line .th{display:inline-flex;align-items:center;gap:6px;padding:2px 2px;cursor:pointer;user-select:none;max-width:100%}
  .tool-line .ic{flex:none;font-size:11px;line-height:1;color:var(--ink-3)}
  .tool-line.running .ic{animation:tl-pulse 1s ease-in-out infinite}
  @keyframes tl-pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .tool-line .verb{color:var(--ink-2);white-space:nowrap}
  .tool-line .sum{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tool-line .chev{flex:none;color:var(--ink-3);font-size:8px;opacity:.5;transition:transform .16s var(--e-out),opacity .14s}
  .tool-line:hover .chev{opacity:1}
  .tool-line.open .chev{transform:rotate(90deg);opacity:1}
  .tool-line .detail{display:none;margin:4px 0 2px;border:1px solid var(--line);border-radius:9px;background:var(--panel);max-height:220px;overflow:auto}
  .tool-line.open .detail{display:block}
  .tool-line .detail .kv{padding:7px 11px;font-size:11.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;border-bottom:1px solid var(--line)}
  .tool-line .detail .kv:last-child{border-bottom:none}
  .tool-line .detail .kv b{color:var(--ink-3);font-weight:500;margin-right:6px}
  .tool-line .detail .kv b{color:var(--ink-3);font-weight:400}
  /* ── chat input:参考 uiverse plastic-parrot,统一胶囊壳,内嵌 mic/输入/发送 ── */
  .chat-input{padding:14px 20px 18px;border-top:1px solid var(--line);flex:none;background:var(--bg)}
  .chat-bar{
    display:flex;align-items:flex-end;gap:6px;padding:6px 6px 6px 8px;
    background:var(--panel);border:1.5px solid var(--line-2);border-radius:22px;
    box-shadow:inset 0 1px 2px color-mix(in srgb,var(--ink) 5%,transparent);
    transition:border-color .18s var(--e-out),box-shadow .18s var(--e-out),background .18s var(--e-out);
  }
  .chat-bar:focus-within{
    border-color:var(--ink-3);background:var(--raised);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent),inset 0 1px 2px color-mix(in srgb,var(--ink) 4%,transparent);
  }
  .chat-bar textarea{
    flex:1;resize:none;border:none;background:none;outline:none;
    padding:8px 4px;font-size:13.5px;font-family:inherit;color:var(--ink);
    max-height:120px;line-height:1.5;align-self:center;
  }
  .chat-bar textarea::placeholder{color:var(--ink-3)}

  /* 圆形语音按钮 */
  .chat-mic{
    width:34px;height:34px;flex:none;border:none;border-radius:50%;cursor:pointer;
    background:transparent;color:var(--ink-3);display:flex;align-items:center;justify-content:center;
    transition:background .14s var(--e-out),color .14s var(--e-out),transform .12s var(--e-out);
  }
  .chat-mic:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
  .chat-mic:active{transform:scale(.9)}
  .chat-mic svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none}
  .chat-mic.recording{color:var(--off);background:var(--off-wash)}
  .chat-mic.recording svg{animation:mic-pulse 1.1s ease-in-out infinite}
  @keyframes mic-pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* 圆角矩形发送按钮:沿用 logo 资产动画(纸飞机 hover 弹性飞出 → logo 弧勾滑入),仅外形由圆改方 */
  .chat-send{
    position:relative;width:52px;height:34px;flex:none;border:none;border-radius:14px;cursor:pointer;overflow:hidden;
    background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;
    transition:transform .12s var(--e-out),box-shadow .18s var(--e-out),opacity .14s;
    box-shadow:0 2px 6px color-mix(in srgb,var(--ink) 24%,transparent);
  }
  .chat-send:hover{transform:translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb,var(--ink) 32%,transparent)}
  .chat-send:active{transform:scale(.94)}
  .chat-send:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none}
  .chat-send .send-plane,.chat-send .send-logo{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    transition:transform .3s cubic-bezier(.34,1.5,.5,1),opacity .2s var(--e-out);
  }
  .chat-send .send-plane svg{width:17px;height:17px;stroke:currentColor;fill:currentColor;stroke-width:1.5;stroke-linejoin:round}
  .chat-send .send-logo{transform:translate(-120%,120%);opacity:0}
  .chat-send .send-logo svg{width:22px;height:22px}
  .chat-send .send-logo .arc{stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .chat-send:hover .send-plane{transform:translate(130%,-130%);opacity:0}
  .chat-send:hover .send-logo{transform:translate(0,0);opacity:1}

  /* ── 设置页面(整页视图) ── */
  .set-page{display:flex;flex-direction:column;height:100%;background:var(--bg);min-width:0}
  .set-head{padding:20px 28px 16px;border-bottom:1px solid var(--line);flex:none}
  .set-title{font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
  .set-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .set-body{flex:1;overflow-y:auto;padding:24px 28px 40px;scrollbar-width:none}
  .set-body::-webkit-scrollbar{width:0}
  .set-inner{max-width:600px}
  .set-group{margin-bottom:24px}
  .set-group:last-of-type{margin-bottom:14px}
  .set-lbl{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .set-desc{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-bottom:11px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:3px;gap:2px}
  .seg button{
    border:none;background:none;padding:6px 16px;border-radius:var(--r-s);font-size:13px;color:var(--ink-2);
    cursor:pointer;font-family:inherit;transition:background .14s var(--e-out),color .14s var(--e-out);
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--raised);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .taglist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .taglist:empty{margin-bottom:0}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:4px 8px 4px 11px;border-radius:var(--r-s)}
  .tag button{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;padding:0;transition:color .14s}
  .tag button:hover{color:var(--off)}
  .tagin{
    width:100%;padding:8px 11px;border:1px solid var(--line-2);border-radius:var(--r-m);
    background:var(--bg);color:var(--ink);font-size:13px;font-family:inherit;outline:none;
    transition:border-color .14s var(--e-out),box-shadow .14s var(--e-out);
  }
  .tagin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .tagin::placeholder{color:var(--ink-3)}
  .set-note{font-size:12px;color:var(--ink-3);line-height:1.6;padding-top:4px}

  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* 仅首次加载入场;数据刷新不再重播(否则每 5s 闪一下) */
  .feed.intro .row{animation:rise .3s var(--e-out) both}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="drag-strip"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 52 52"><path class="arc" d="M13 27C20 37 24 39 27 39 32 39 36 25 41 13"/></svg>
      <div class="name">ScreenTodo</div>
    </div>
    <!-- 多会话管理器 -->
    <div class="chat-sec">
      <div class="chat-sec-label">对话</div>
      <div class="session-list" id="session-list"></div>
      <button class="session-new" id="session-new">+ 新建会话</button>
    </div>
    <div class="top-divider"></div>
    <div class="nav-h">筛选</div>
    <div class="tab" data-f="all"><span class="lbl">全部</span><span class="cnt" id="c-all">0</span></div>
    <div class="tab pending" data-f="pending"><span class="lbl">待处理</span><span class="cnt" id="c-pending">0</span></div>
    <div class="tab accepted" data-f="accepted"><span class="lbl">已采纳</span><span class="cnt" id="c-accepted">0</span></div>
    <div class="tab ignored" data-f="ignored"><span class="lbl">已忽略</span><span class="cnt" id="c-ignored">0</span></div>
    <div class="top-divider"></div>
    <div class="tab view-tab" id="tab-settings" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">设置</span>
    </div>
  </aside>

  <section class="main">
    <!-- 工作记忆(筛选)视图 -->
    <div class="view view-feed hidden" id="view-feed">
      <div class="canvas" id="canvas">
        <header class="head"><h1 id="head-title">工作记忆</h1><p id="head-sub">从屏幕、对话与文档中安静捕获的上下文。</p></header>
        <div class="feed" id="list"></div>
      </div>
      <div class="vscroll" id="vscroll"><div class="thumb" id="vthumb"></div></div>

      <div class="scrim" id="scrim"></div>
      <aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-label="记忆详情">
        <div class="dh"><h2 id="d-title">—</h2><button class="dclose" id="d-close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></div>
        <div class="db" id="d-body"></div>
        <div class="vscroll" id="dscroll"><div class="thumb" id="dthumb"></div></div>
      </aside>
    </div>

    <!-- 对话页面(默认主视图) -->
    <div class="view view-chat" id="view-chat">
      <div class="chat-page">
        <div class="chat-body" id="chat-body">
          <div class="chat-glow" id="chat-glow"></div>
        </div>
        <div class="chat-input">
          <div class="chat-bar" id="chat-bar">
            <button class="chat-mic" id="chat-mic" aria-label="语音输入" title="语音输入"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke-linecap="round"/></svg></button>
            <textarea id="chat-text" rows="1" placeholder="发消息…"></textarea>
            <button class="chat-send" id="chat-send" aria-label="发送">
              <span class="send-plane"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8z"/></svg></span>
              <span class="send-logo"><svg viewBox="0 0 52 52"><path class="arc" d="M13 27C20 37 24 39 27 39 32 39 36 25 41 13"/></svg></span>
            </button>
          </div>
        </div>
        <div class="vscroll" id="cscroll"><div class="thumb" id="cthumb"></div></div>
      </div>
    </div>
    <div class="view view-settings hidden" id="view-settings">
      <div class="set-page">
        <div class="set-head">
          <div class="set-inner">
            <div class="set-title">设置</div>
            <div class="set-sub">外观、捕获范围等偏好。改动即时生效。</div>
          </div>
        </div>
        <div class="set-body">
          <div class="set-inner">
            <div class="set-group">
              <div class="set-lbl">外观</div>
              <div class="set-desc">工作台的明暗主题。</div>
              <div class="seg" id="seg-theme">
                <button data-t="auto" class="on">跟随系统</button>
                <button data-t="light">亮色</button>
                <button data-t="dark">深色</button>
              </div>
            </div>
            <div class="set-group">
              <div class="set-lbl">进程黑名单</div>
              <div class="set-desc">这些应用里的内容不会被捕获（如终端、密码管理器）。回车添加。</div>
              <div class="taglist" id="deny-list"></div>
              <input class="tagin" id="deny-in" placeholder="输入应用名后回车…" list="procs" />
            </div>
            <div class="set-group">
              <div class="set-lbl">进程白名单</div>
              <div class="set-desc">留空 = 监控全部应用；填了则<b>只</b>监控名单内的应用。</div>
              <div class="taglist" id="allow-list"></div>
              <input class="tagin" id="allow-in" placeholder="输入或从系统进程选择…" list="procs" />
            </div>
            <div class="set-note" id="set-note"></div>
            <datalist id="procs"></datalist>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtTime=(t)=>{if(!t)return'';const d=new Date(t);return isNaN(d)?'':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});};
  let filter='all';
  let selId=null;
  let introDone=false;      // 入场动画只播一次
  let lastSig=null;         // 数据签名,相同则跳过重渲染(防闪)

  const HEAD={
    all:['工作记忆','从屏幕、对话与文档中安静捕获的上下文。'],
    pending:['待处理','尚未采纳或忽略的捕获。'],
    accepted:['已采纳','已加入 vault 的待办。'],
    ignored:['已忽略','你判定与自己无关的捕获。']
  };
  const EMPTY={
    all:['还没有捕获','屏幕上出现值得记的内容时，会安静地沉淀在这里。'],
    pending:['没有待处理','新捕获会先落在这里，等你采纳或忽略。'],
    accepted:['还没有采纳','采纳的建议会写入 vault，并在这里留痕。'],
    ignored:['没有忽略','你判定无关的捕获会归档在这里。']
  };
  const ICON_EMPTY='<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" stroke-linecap="round"/></svg>';

  window.renderRecall=function(){
    const data=window.__RECALL__||[];
    // 防闪:数据 + 当前筛选 + 选中项 都没变 → 不重建 DOM
    const sig=filter+'|'+selId+'|'+data.length+'|'+data.map(d=>(d.id||'')+(d.status||'')).join(',');
    if(sig===lastSig) return;
    const firstPaint=(lastSig===null);
    lastSig=sig;
    const cnt={all:data.length,pending:0,accepted:0,ignored:0};
    data.forEach(d=>{ if(d.status==='accepted')cnt.accepted++; else if(d.status==='ignored')cnt.ignored++; else cnt.pending++; });
    for(const k of ['all','pending','accepted','ignored']) document.getElementById('c-'+k).textContent=cnt[k];
    document.getElementById('head-title').textContent=HEAD[filter][0];
    document.getElementById('head-sub').textContent=HEAD[filter][1];

    let items=data;
    if(filter==='pending') items=data.filter(d=>!d.status);
    else if(filter==='accepted') items=data.filter(d=>d.status==='accepted');
    else if(filter==='ignored') items=data.filter(d=>d.status==='ignored');

    const list=document.getElementById('list');
    // 入场动画只在首帧播,之后刷新不再播(防每 5s 闪)
    if(firstPaint && !introDone){ list.classList.add('intro'); introDone=true; setTimeout(()=>list.classList.remove('intro'),400); }
    else list.classList.remove('intro');
    if(!items.length){
      list.innerHTML=`<div class="empty">${ICON_EMPTY}<div class="t">${EMPTY[filter][0]}</div><div class="s">${EMPTY[filter][1]}</div></div>`;
      return;
    }
    list.innerHTML=items.map((it)=>{
      const idx=data.indexOf(it);
      const ctx=it.kind==='task'
        ?'<span class="src">vault · 日常/</span>'+esc(it.file||'')
        :(it.context?'<span class="src">'+(it.apps&&it.apps.length?esc(it.apps[0])+' · ':'')+'</span>'+esc(it.context):'');
      const flag=it.status==='accepted'?'<span class="pill acc flag">已采纳</span>'
        :it.status==='ignored'?'<span class="pill ign flag">已忽略</span>':'';
      const sel=(it.id&&it.id===selId)?' sel':'';
      return `<div class="row${sel}" data-idx="${idx}" tabindex="0" role="button">`+
        `<div class="tt">${esc(it.title)}</div>`+
        `<div class="meta">${fmtTime(it.time)}</div>`+
        `<div class="ctx">${ctx}</div>${flag}</div>`;
    }).join('');
    list.querySelectorAll('.row').forEach(r=>{
      const open=()=>openDetail(data[+r.dataset.idx]);
      r.addEventListener('click',open);
      r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
    });
    if(window.__syncScroll) window.__syncScroll();
  };

  function openDetail(it){
    if(!it)return;
    selId=it.id||null;
    document.getElementById('d-title').textContent=it.title||'—';
    const stCls=it.status==='accepted'?'acc':it.status==='ignored'?'ign':'pend';
    const stTxt=it.status==='accepted'?'已采纳':it.status==='ignored'?'已忽略':'待处理';
    const apps=(it.apps&&it.apps.length)?it.apps:(it.tag?[it.tag]:[]);
    const parts=[];
    parts.push(`<div class="sec"><div class="lbl">状态</div><div class="val"><span class="stline ${stCls}">${stTxt}</span></div></div>`);
    if(it.kind==='task') parts.push(`<div class="sec"><div class="lbl">来源</div><div class="val mut">vault · 日常/${esc(it.file||'')}</div></div>`);
    else{
      if(apps.length) parts.push(`<div class="sec"><div class="lbl">来源</div><div class="chips">${apps.map(a=>'<span class="chip">'+esc(a)+'</span>').join('')}</div></div>`);
      if(it.reason) parts.push(`<div class="sec"><div class="lbl">为什么捕获</div><div class="val mut">${esc(it.reason)}</div></div>`);
      if(it.context) parts.push(`<div class="sec"><div class="lbl">触发片段</div><div class="val">${esc(it.context)}</div></div>`);
      if(it.raw) parts.push(`<div class="sec"><div class="lbl">触发时的屏幕上下文</div><div class="rawbox">${esc(it.raw)}</div></div>`);
    }
    parts.push(`<div class="sec"><div class="lbl">时间</div><div class="val mut">${fmtTime(it.time)}</div></div>`);
    document.getElementById('d-body').innerHTML=parts.join('');
    document.getElementById('drawer').classList.add('open');
    document.getElementById('scrim').classList.add('on');
    document.getElementById('d-body').scrollTop=0;
    // 抽屉展开动画结束后再同步滚动条(此时高度稳定)
    setTimeout(()=>{ if(window.__syncDrawer)window.__syncDrawer(); },300);
    window.renderRecall();
  }
  function closeDetail(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('scrim').classList.remove('on');
    selId=null;window.renderRecall();
  }
  document.getElementById('d-close').addEventListener('click',closeDetail);
  document.getElementById('scrim').addEventListener('click',closeDetail);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});

  // ── 视图切换:对话(默认) / 工作记忆(筛选) / 设置 ──
  let view='chat';
  function setView(v){
    view=v;
    document.getElementById('view-feed').classList.toggle('hidden', v!=='feed');
    document.getElementById('view-chat').classList.toggle('hidden', v!=='chat');
    document.getElementById('view-settings').classList.toggle('hidden', v!=='settings');
    // 全局互斥激活:先清所有(侧栏 tab + 会话项),再点亮当前所在
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    if(v!=='chat') document.querySelectorAll('.session-item').forEach(x=>x.classList.remove('active'));
    if(v==='chat'){

  // ── 自定义 overlay 滚动条:真正可动画(细→粗、淡→暗、拖拽)。工厂,复用于主列表 + 详情抽屉 ──
  function bindScroll(scrollEl, track, thumb, watchEl){
    if(!scrollEl||!track||!thumb)return null;
    let dragging=false, startY=0, startTop=0, curTop=0, curH=28;
    function sync(){
      const {scrollHeight,clientHeight,scrollTop,offsetTop}=scrollEl;
      if(scrollHeight<=clientHeight+1){track.style.display='none';return;}
      track.style.display='';
      // track 对齐滚动容器在其定位父级内的位置(抽屉里要让开头部 .dh)
      track.style.top=offsetTop+'px';track.style.height=clientHeight+'px';
      curH=Math.max(28, clientHeight*clientHeight/scrollHeight);
      const maxTop=clientHeight-curH;
      curTop=maxTop*(scrollTop/(scrollHeight-clientHeight));
      thumb.style.height=curH+'px';thumb.style.top=curTop+'px';
    }
    scrollEl.addEventListener('scroll',sync,{passive:true});
    new ResizeObserver(sync).observe(scrollEl);
    if(watchEl) new MutationObserver(sync).observe(watchEl,{childList:true,subtree:true});
    track.addEventListener('mouseenter',()=>track.classList.add('hot'));
    track.addEventListener('mouseleave',()=>{ if(!dragging) track.classList.remove('hot'); });
    track.addEventListener('mousedown',e=>{
      const {scrollHeight,clientHeight}=scrollEl;
      const y=e.clientY-track.getBoundingClientRect().top;
      if(y<curTop||y>curTop+curH){ const maxTop=clientHeight-curH; const nt=Math.min(maxTop,Math.max(0,y-curH/2)); scrollEl.scrollTop=(nt/maxTop)*(scrollHeight-clientHeight); }
      dragging=true;thumb.classList.add('drag');track.classList.add('hot');startY=e.clientY;startTop=parseFloat(thumb.style.top)||0;e.preventDefault();
    });
    window.addEventListener('mousemove',e=>{
      if(!dragging)return;
      const {scrollHeight,clientHeight}=scrollEl;
      const maxTop=clientHeight-curH;
      let nt=Math.min(maxTop,Math.max(0,startTop+(e.clientY-startY)));
      scrollEl.scrollTop=(nt/maxTop)*(scrollHeight-clientHeight);
    });
    window.addEventListener('mouseup',()=>{ if(!dragging)return; dragging=false;thumb.classList.remove('drag'); if(!track.matches(':hover'))track.classList.remove('hot'); });
    setTimeout(sync,60);
    return sync;
  }
  window.__syncScroll = bindScroll(document.getElementById('canvas'), document.getElementById('vscroll'), document.getElementById('vthumb'), document.getElementById('list'));
  window.__syncDrawer = bindScroll(document.getElementById('d-body'), document.getElementById('dscroll'), document.getElementById('dthumb'), document.getElementById('d-body'));

  // ── 会话 ... 菜单(文本按钮:重命名 / 删除) ──

    menu.style.top = (r.bottom + 4) + 'px';

    bDel.addEventListener('click', async e => { e.stopPropagation(); closeSesMenu(); await deleteSession(id); });

  // ── 会话拖拽排序:纯 pointer 事件,长按 250ms 激活。不使用 HTML5 draggable(会禁掉文本选择/干扰光圈) ──
  let _sesDrag = null, _sesDragMoved = false, _sesHoldTimer = null;
  function clearDropMarks(list) { list.querySelectorAll('.session-item').forEach(i => i.classList.remove('drop-above', 'drop-below')); }
  function onSesPointerDown(e, item, list) {
    if (e.button !== 0) return;
    if (e.target.closest('.ses-menu-btn') || e.target.closest('.ses-rename')) return;
    const startY = e.clientY, sid = item.dataset.sid;
    _sesDragMoved = false;
    let active = false, marker = null, lastBefore = null;

    const activate = () => {
      active = true;
      item.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'grabbing';
    };
    _sesHoldTimer = setTimeout(activate, 250);

    const move = ev => {
      if (!active) {
        // 未激活前:移动超阈值则取消长按(视为滚动/误触),不进入拖拽
        if (Math.abs(ev.clientY - startY) > 6) { clearTimeout(_sesHoldTimer); }
        return;
      }
      _sesDragMoved = true;
      clearDropMarks(list);
      const items = [...list.querySelectorAll('.session-item')];
      let target = null;
      for (const it of items) {
        if (it === item) continue;
        const r = it.getBoundingClientRect();
        if (ev.clientY >= r.top && ev.clientY <= r.bottom) { target = it; break; }
      }
      if (!target) {
        // 落在列表首/尾空白
        const first = items[0], last = items[items.length - 1];
        if (first && ev.clientY < first.getBoundingClientRect().top) { first.classList.add('drop-above'); marker = { el: first, before: true }; }
        else if (last && ev.clientY > last.getBoundingClientRect().bottom) { last.classList.add('drop-below'); marker = { el: last, before: false }; }
        return;
      }
      const r = target.getBoundingClientRect();
      const before = ev.clientY < r.top + r.height / 2;
      target.classList.add(before ? 'drop-above' : 'drop-below');
      marker = { el: target, before };
    };

    const up = async () => {
      clearTimeout(_sesHoldTimer);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      if (!active) return;
      item.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      clearDropMarks(list);
      if (marker && marker.el && marker.el.dataset.sid !== sid) {
        await reorderSession(sid, marker.el.dataset.sid, marker.before);
      }
    };

    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  // 清空对话区,但保留跟随光圈节点(chat-glow)。直接 innerHTML='' 会删掉 glow → 光圈/IBeam 失效
  function clearChatBody(body) {

  // 工具名 → 人话动作(模块级,实时渲染与历史重放共用)。未知工具降级为原名。
  const TOOL_VERB={ list_todos:'查看待办', search_captured:'搜索记忆', get_more_context:'查看屏幕上下文', save_todo:'记录待办' };
  function toolVerb(name){ return TOOL_VERB[name] || name; }

  // 每会话草稿存储(sid → 未发送文本)。切换会话时保存旧、恢复新
  const _drafts = {};
  let _curSid = null;
  function saveCurrentDraft() {
    if (_curSid != null && window.__chatDraft) _drafts[_curSid] = window.__chatDraft.read();

  function renderSessionMessages(ses) {
    const body = document.getElementById('chat-body');
    if (!body) return;
    // 先存旧会话草稿,再切
    saveCurrentDraft();
    clearChatBody(body);
    // 用与流式渲染同一套同步 md(window.__mdRender);未就绪时退回转义+换行(绝不能用异步的 orb.renderMarkdown,会渲出 [object Promise])
    const rmd = (s) => (window.__mdRender ? window.__mdRender(s) : esc(s||'').replace(/\n/g, '<br>'));
    if (!ses || !ses.messages || !ses.messages.length) {
      const empty = document.createElement('div'); empty.className = 'chat-empty'; empty.textContent = '开始一段对话吧。';
      body.appendChild(empty);
    } else {
      for (const m of ses.messages) {
        if (m.role === 'user') {
          const d = document.createElement('div'); d.className = 'msg u'; d.textContent = m.content; body.appendChild(d);
        } else if (m.role === 'tool') {
          // 历史工具行:只存了工具名,渲染成与实时一致的极简行(无详情可展开)
          const d = document.createElement('div'); d.className = 'tool-line';
          d.innerHTML = '<div class="th" style="cursor:default"><span class="ic">✓</span><span class="verb">'
            + esc(typeof toolVerb === 'function' ? toolVerb(m.content) : m.content) + '</span></div>';
          body.appendChild(d);
        } else {
          const d = document.createElement('div'); d.className = 'answer'; d.innerHTML = rmd(m.content); body.appendChild(d);
        }
      }
      body.scrollTop = body.scrollHeight;
    }
    // 恢复新会话草稿
    _curSid = ses ? ses.id : null;
    if (window.__chatDraft) window.__chatDraft.set(_curSid != null ? (_drafts[_curSid] || '') : '');
  }

  async function createSession() {
    if (!window.orb || !window.orb.createSession) return;
    let data;

  async function deleteSession(id) {
    if (!window.orb || !window.orb.deleteSession) return;

  async function startRename(id) {
    const item = document.querySelector('.session-item[data-sid="' + id + '"]');
    if (!item) return;
    const nameSpan = item.querySelector('.ses-name');
    const oldName = nameSpan.textContent;
    const input = document.createElement('input');
    input.className = 'ses-rename'; input.value = oldName;
    nameSpan.replaceWith(input);
    input.focus(); input.select();
    const finish = async () => {
      const newName = input.value.trim() || oldName;
      const restored = document.createElement('span'); restored.className = 'ses-name'; restored.textContent = newName;
      input.replaceWith(restored);
      if (newName !== oldName && window.orb && window.orb.renameSession) {
        try { await window.orb.renameSession(id, newName); await renderSessionList(); } catch (_) {}
      }
    };
    input.addEventListener('blur', finish);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') { input.value = oldName; input.blur(); } });
  }

  async function reorderSession(dragId, targetId, insertBefore) {
    if (!window.orb || !window.orb.listSessions) return;
    let data;
    try { data = await window.orb.listSessions(); } catch (_) { return; }
    const arr = data.list;
    const dragIdx = arr.findIndex(x => x.id === dragId);
    let targetIdx = arr.findIndex(x => x.id === targetId);
    if (dragIdx < 0 || targetIdx < 0 || dragIdx === targetIdx) return;
    const [item] = arr.splice(dragIdx, 1);
    if (dragIdx < targetIdx) targetIdx--;
    if (insertBefore) arr.splice(targetIdx, 0, item);
    else arr.splice(targetIdx + 1, 0, item);
    const ids = arr.map(x => x.id);
    try { await window.orb.reorderSessions(ids); await renderSessionList(); } catch (_) {}
  }

  // ── 对话面板(整页视图 + agui 流式 + md 渲染) ──
  (function chatPanel(){
    const body=document.getElementById('chat-body');
    const ta=document.getElementById('chat-text');
    const sendBtn=document.getElementById('chat-send');
    if(!ta)return;
    let busy=false;
    // 每会话输入框草稿:切走存、切入取。内存级(刷新丢),对草稿够用
    window.__chatDraft = {
      read(){ return ta.value; },
      set(v){ ta.value = v||''; ta.style.height='auto'; ta.style.height=Math.min(120, ta.scrollHeight)+'px'; },
    };
    const micBtn=document.getElementById('chat-mic');
    // 跟随鼠标的科技感小圈:平滑 lerp 追随光标(带一点延迟惯性感)
    const glow=document.getElementById('chat-glow');
    if(glow){
      let tx=0, ty=0, cx=0, cy=0, anim=0, inside=false, ibeam=false, selecting=false;
      const tick=()=>{
        // IBeam 模式(或拖拽选择中)不做惯性延迟,精准贴合;圆环模式保留 lerp 拖尾
        const k = (ibeam||selecting) ? 1 : 0.22;
        cx+=(tx-cx)*k; cy+=(ty-cy)*k;
        glow.style.left=cx+'px'; glow.style.top=cy+'px';
        if(inside || Math.abs(tx-cx)>0.5 || Math.abs(ty-cy)>0.5) anim=requestAnimationFrame(tick);
        else anim=0;
      };
      // 命中可选文本区(answer/msg)→ 切 IBeam;否则圆环
      const overText=(el)=> !!(el && el.closest && el.closest('.answer, .msg'));
      body.addEventListener('mousemove',(e)=>{
        const r=body.getBoundingClientRect();
        tx=e.clientX-r.left; ty=e.clientY-r.top+body.scrollTop;
        const nowIbeam = overText(e.target);
        if(nowIbeam!==ibeam){ ibeam=nowIbeam; glow.classList.toggle('ibeam', ibeam); }
        if(!anim) anim=requestAnimationFrame(tick);
      });
      body.addEventListener('mouseenter',()=>{ inside=true; });
      body.addEventListener('mouseleave',()=>{ inside=false; ibeam=false; selecting=false; glow.classList.remove('ibeam','selecting'); });
      // 拖拽选择中:IBeam 变实、精准贴合
      body.addEventListener('mousedown',(e)=>{ if(overText(e.target)){ selecting=true; glow.classList.add('selecting'); } });
      window.addEventListener('mouseup',()=>{ if(selecting){ selecting=false; glow.classList.remove('selecting'); } });
    }
    // 自增高
    ta.addEventListener('input',()=>{ ta.style.height='auto'; ta.style.height=Math.min(120,ta.scrollHeight)+'px'; });

    // ── 语音输入(Web Speech API;环境不支持时优雅降级) ──
    let recognizer=null, recording=false, recBase='';
    function flashMicNote(msg){ if(micBtn) micBtn.title=msg; }
    function stopRec(){
      recording=false;
      if(micBtn) micBtn.classList.remove('recording');
      if(recognizer){ try{recognizer.stop();}catch(_){} recognizer=null; }
    }
    function startRec(){
      if(recording) return;
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){ flashMicNote('当前环境不支持语音输入(需系统/浏览器语音识别)'); if(micBtn) micBtn.classList.add('unsupported'); return; }
      const r=new SR();
      r.lang='zh-CN'; r.interimResults=true; r.continuous=false;
      r.onresult=(e)=>{
        let txt=''; for(let i=e.resultIndex;i<e.results.length;i++) txt+=e.results[i][0].transcript;
        ta.value=(recBase||'')+txt; ta.style.height='auto'; ta.style.height=Math.min(120,ta.scrollHeight)+'px';
      };
      r.onend=()=>stopRec();
      r.onerror=(ev)=>{ const bad=(ev&&(ev.error==='not-allowed'||ev.error==='service-not-allowed'));
        flashMicNote(bad?'麦克风权限被拒绝':'语音识别出错，已停止'); stopRec(); };
      try{ r.start(); recording=true; recBase=ta.value; if(micBtn) micBtn.classList.remove('unsupported'); micBtn.classList.add('recording'); micBtn.title='正在聆听…再点停止'; }
      catch(_){ flashMicNote('无法启动语音识别'); }
    }
    if(micBtn) micBtn.addEventListener('click',()=>{ recording?stopRec():startRec(); });

    function clearEmpty(){ const e=body.querySelector('.chat-empty'); if(e)e.remove(); }
    function addUser(text){
      clearEmpty();
      const d=document.createElement('div'); d.className='msg u'; d.textContent=text;
      body.appendChild(d); body.scrollTop=body.scrollHeight; return d;
    }
    function addThinking(){
      clearEmpty();
      const d=document.createElement('div'); d.className='thinking'; d.textContent='思考中';
      body.appendChild(d); body.scrollTop=body.scrollHeight; return d;
    }
    // Agent 输出:无气泡的 playground 内容块
    function addAnswer(){
      clearEmpty();
      const d=document.createElement('div'); d.className='answer streaming'; d.innerHTML='';
      body.appendChild(d); body.scrollTop=body.scrollHeight; return d;
    }
    // 打字机式流式:把完整文本逐字渐显,期间实时渲染 markdown。底层非流式(稳),前端做流式观感。
    async function typewriter(el, full){
      const atBottom=()=> body.scrollHeight-body.scrollTop-body.clientHeight < 40;
      const total=full.length;
      // 长文本步长大些,避免太慢;短文本一字一字
      const step=total>400?6:(total>120?3:2);
      let i=0, lastRender=0;
      while(i<total){
        i=Math.min(total,i+step);
        const now=performance.now();
        // 每 ~50ms 重渲一次 markdown(避免每字都渲染卡顿)
        if(now-lastRender>50 || i>=total){ el.innerHTML=md(full.slice(0,i)); lastRender=now; }
        if(atBottom()) body.scrollTop=body.scrollHeight;
        await new Promise(r=>setTimeout(r,12));
      }
      el.classList.remove('streaming');
      const rendered = full && full.trim() ? md(full) : '';
      el.innerHTML = rendered || '<span style="color:var(--ink-3)">（没有返回内容）</span>';
      if(atBottom()) body.scrollTop=body.scrollHeight;
    }
    function argSummary(name, args){
      if(!args||typeof args!=='object') return '';
      if(name==='list_todos') return ({today:'今天',pending:'待处理',all:'全部'})[args.scope]||args.scope||'';
      if(name==='search_captured') return args.query? '“'+args.query+'”':'';
      if(name==='get_more_context') return [args.app,args.hint].filter(Boolean).join(' · ');
      if(name==='save_todo') return args.title||'';
      const v=Object.values(args)[0]; return v? String(v):'';
    }
    function addToolLine(name, args){
      const d=document.createElement('div'); d.className='tool-line running';
      const sum=argSummary(name,args);
      d.innerHTML=
        '<div class="th"><span class="ic">○</span>'
        +'<span class="verb">'+esc(toolVerb(name))+'</span>'
        +(sum?'<span class="sum">'+esc(sum)+'</span>':'')
        +'<span class="chev">▸</span></div>'
        +'<div class="detail"></div>';
      const th=d.querySelector('.th');
      th.addEventListener('click',()=>{ d.classList.toggle('open'); });
      body.appendChild(d); body.scrollTop=body.scrollHeight; return d;
    }
    // 工具执行完:图标转勾、填详情(参数 + 结果摘要)
    function finishToolLine(d, name, args, result){
      if(!d) return;
      d.classList.remove('running');
      const ic=d.querySelector('.ic'); if(ic) ic.textContent='✓';
      let res=String(result||'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'');
      // 结果若是 JSON,提炼一句摘要(如"共 82 条")
      let brief='';
      try{ const o=JSON.parse(res); if(o&&typeof o==='object'){ if('total' in o) brief='共 '+o.total+' 条'; else if(Array.isArray(o)) brief=o.length+' 条结果'; } }catch(e){}
      if(brief){
        let sumEl=d.querySelector('.sum');
        if(!sumEl){ sumEl=document.createElement('span'); sumEl.className='sum'; d.querySelector('.chev').before(sumEl); }
        sumEl.textContent=(sumEl.textContent?sumEl.textContent+' → ':'')+brief;
      }
      const det=d.querySelector('.detail');
      if(det){
        det.innerHTML='<div class="kv">'+esc(humanizeResult(res))+'</div>';
      }
      body.scrollTop=body.scrollHeight;
    }
    // 把工具结果变成人话(不给用户看 raw JSON)。JSON→逐条列;非JSON→截断原文。
    function humanizeResult(res){
      try{
        const o=JSON.parse(res);
        if(Array.isArray(o)) return o.map((x,i)=>(i+1)+'. '+(x.title||x.name||JSON.stringify(x))).join('\n') || '（空）';
        if(o&&typeof o==='object'){
          const items=o.items||o.results||o.list;
          if(Array.isArray(items)){
            const head=('total' in o)?('共 '+o.total+' 条'+(o.scope?('（'+o.scope+'）'):'')+'\n'):'';
            return head + items.map((x,i)=>(i+1)+'. '+(x.title||x.name||'')+(x.status?('  ·'+x.status):'')+(x.time?('  '+x.time):'')).join('\n');
          }
          return Object.entries(o).map(([k,v])=>k+'：'+(typeof v==='object'?JSON.stringify(v):v)).join('\n');
        }
      }catch(e){}
      return res.length>800? res.slice(0,800)+' …' : (res||'（无内容）');
    }
    // 轻量 markdown 渲染(渲染进程内,同步、零 IPC、零依赖)。覆盖 agent 常用语法:
    // 标题/加粗/斜体/行内code/代码块/有序无序列表/引用/分割线/链接。先转义再逐条替换,防 XSS。
    function md(s){
      // 先剥掉控制字符/占位哨兵:OCR 结果可能含 \u0000 等,会与下面代码块占位冲突 → 渲染坍塌
      let t = esc(String(s||'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,''));
      // 代码块 ```...``` (先占位,避免内部被其它规则破坏)
      const blocks=[];
      t = t.replace(/```([\s\S]*?)```/g, (m,code)=>{ blocks.push(code.replace(/^\n/,'')); return '\u0000CB'+(blocks.length-1)+'\u0000'; });
      const lines = t.split('\n');
      let out=[], i=0;
      while(i<lines.length){
        let ln=lines[i];
        // 代码块占位符独占行
        const cb=ln.match(/^\u0000CB(\d+)\u0000$/);
        if(cb){ out.push('<pre><code>'+blocks[+cb[1]]+'</code></pre>'); i++; continue; }
        // 分割线
        if(/^\s*---+\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
        // 标题
        let hm=ln.match(/^(#{1,3})\s+(.*)$/);
        if(hm){ const lv=hm[1].length; out.push('<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>'); i++; continue; }
        // 引用
        if(/^\s*>\s?/.test(ln)){ let q=[]; while(i<lines.length&&/^\s*>\s?/.test(lines[i])){ q.push(inline(lines[i].replace(/^\s*>\s?/,''))); i++; } out.push('<blockquote>'+q.join('<br>')+'</blockquote>'); continue; }
        // 有序列表
        if(/^\s*\d+\.\s+/.test(ln)){ let items=[]; while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){ items.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++; } out.push('<ol>'+items.join('')+'</ol>'); continue; }
        // 无序列表
        if(/^\s*[-*]\s+/.test(ln)){ let items=[]; while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){ items.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++; } out.push('<ul>'+items.join('')+'</ul>'); continue; }
        // 空行
        if(/^\s*$/.test(ln)){ i++; continue; }
        // 普通段落(合并连续非空非块行)
        let para=[ln]; i++;
        while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s|>\s?|\s*[-*]\s|\s*\d+\.\s|\s*---+\s*$)/.test(lines[i]) && !/^\u0000CB\d+\u0000$/.test(lines[i])){ para.push(lines[i]); i++; }
        out.push('<p>'+para.map(inline).join('<br>')+'</p>');
      }
      return out.join('');
    }
    // 行内:加粗/斜体/行内code/链接
    function inline(s){
      return s
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g,'<em>$1</em>')
        .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2">$1</a>');
    }
    // 暴露给外部(历史会话渲染复用同一套同步 md,避免异步 IPC 渲染出 [object Promise])
    window.__mdRender = md;

    async function send(){
      const text=ta.value.trim(); if(!text||busy)return;
      busy=true; sendBtn.disabled=true;
      addUser(text); ta.value=''; ta.style.height='auto';

      let think=addThinking();
      let curA=null, curTool=null, pending=null;

      try{
        await window.orb.chatStream(text, {
          onEvent(ev){
            switch(ev.type){
              case 'RUN_STARTED': break;
              case 'TEXT_MESSAGE_START':
                if(think){ think.remove(); think=null; }
                curA=addAnswer(); pending='';
                break;
              case 'TEXT_MESSAGE_CONTENT':
                pending=(pending||'')+(ev.delta||'');   // 后端非流式:整段一次到达,先攒着
                break;
              case 'TEXT_MESSAGE_END':
                // 用打字机把这段渐显渲染(异步,不阻塞事件)
                if(curA && pending!=null){ const el=curA, txt=pending; typewriter(el, txt); }
                curA=null; pending=null;
                break;
              case 'TOOL_CALL_START':
                if(think){ think.remove(); think=null; }
                curTool=addToolLine(ev.toolName||'?', ev.args);
                break;
              case 'TOOL_CALL_END':
                finishToolLine(curTool, ev.toolName, ev.args, ev.result); curTool=null;
                break;
            }
          },
          onDone(){
            if(think){ think.remove(); think=null; }
            curA=null; pending=null;
          },
          onError(err){
            if(think){ think.remove(); think=null; }
            const e=addAnswer(); e.classList.remove('streaming'); e.textContent='出错了: '+(err||'未知错误');
          }
        });
      }catch(e){
        if(think){ think.remove(); think=null; }
        const er=addAnswer(); er.classList.remove('streaming'); er.textContent='出错了: '+e.message;
      }
      busy=false; sendBtn.disabled=false; ta.focus();
    }
    sendBtn.addEventListener('click',send);
    // Enter = 换行(不再误发送);⌘/Ctrl+Enter = 显式发送
    ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); send(); } });
  })();
</script>
</body>
