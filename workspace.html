<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claw</title>
<style>
  :root{
    --bg:#F4F1EA; --surface:#FFFFFF; --surface-2:#FBFAF6;
    --cream:#F2EEE5; --gray:#ECE9E2; --gray-2:#E4E0D8;
    --sage:#7E9683; --sage-deep:#6B8472; --sage-soft:#E9EFEA;
    --ink:#2C2A26; --ink-2:#6F6A61; --ink-3:#A39D92;
    --border:#E7E3DA; --border-strong:#DDD8CD;
    --red:#C5484D;
    --shadow-soft:0 1px 2px rgba(40,36,30,.05), 0 6px 18px rgba(40,36,30,.05);
    --overlay-h:38px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .drag-strip{position:fixed;top:0;left:0;right:0;height:var(--overlay-h);-webkit-app-region:drag;z-index:200}
  .app{display:flex;height:100%;padding-top:var(--overlay-h)}

  /* sidebar */
  .sidebar{width:208px;flex:none;background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 14px 12px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;-webkit-app-region:drag}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--sage);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-soft)}
  .brand .mark svg{width:17px;height:17px;stroke:#fff;stroke-width:1.7;fill:none}
  .brand .name{font-size:15px;font-weight:600}
  .brand .sub{font-size:11px;color:var(--ink-3);font-weight:500}
  .nav-label{font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 6px}
  .tab{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s;-webkit-app-region:no-drag}
  .tab .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);background:var(--gray);border-radius:10px;padding:1px 7px;min-width:20px;text-align:center}
  .tab:hover{background:var(--gray);color:var(--ink)}
  .tab.active{background:var(--sage-soft);color:var(--sage-deep);font-weight:600}
  .tab.active .cnt{background:#dbe6dd;color:var(--sage-deep)}
  .side-foot{margin-top:auto;display:flex;gap:4px;padding:10px 4px 2px;border-top:1px solid var(--border)}
  .side-foot .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-3);transition:background .15s,color .15s}
  .side-foot .ic:hover{background:var(--gray);color:var(--ink)}
  .side-foot .ic svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.6;fill:none}

  /* main */
  .main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
  .canvas{flex:1;overflow-y:auto;padding:8px 30px 40px;-webkit-app-region:no-drag}
  .canvas::-webkit-scrollbar{width:9px}
  .canvas::-webkit-scrollbar-thumb{background:var(--gray-2);border-radius:6px;border:3px solid var(--bg)}
  .view-head{padding:22px 6px 16px}
  .view-head h1{font-size:20px;font-weight:600}
  .view-head p{font-size:12.5px;color:var(--ink-3);margin-top:4px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 18px;margin-bottom:11px;cursor:pointer;transition:box-shadow .18s,transform .18s,border-color .18s}
  .card:hover{box-shadow:var(--shadow-soft);border-color:var(--border-strong);transform:translateY(-1px)}
  .card.sel{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage-soft)}
  .card .ch{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .card .tt{font-size:14px;font-weight:600;line-height:1.35}
  .card .meta{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap;flex:none}
  .card .ctx{font-size:13px;color:var(--ink-2);line-height:1.6;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .ctx .src{color:var(--ink-3)}
  .st{font-size:11px;font-weight:500;padding:1px 7px;border-radius:10px;flex:none}
  .st.acc{color:var(--sage-deep);background:var(--sage-soft)}
  .st.ign{color:var(--red);background:#f6e9e9}
  .empty{text-align:center;color:var(--ink-3);font-size:13px;padding:60px 0}

  /* detail drawer */
  .drawer{position:absolute;top:0;right:0;width:420px;height:100%;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 32px rgba(40,36,30,.08);transform:translateX(100%);transition:transform .24s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;z-index:100}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{padding:calc(var(--overlay-h) + 16px) 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
  .drawer .dh h2{font-size:16px;font-weight:600;line-height:1.4;flex:1}
  .drawer .dclose{width:28px;height:28px;border-radius:7px;border:none;background:var(--gray);color:var(--ink-2);cursor:pointer;flex:none;font-size:15px;display:flex;align-items:center;justify-content:center}
  .drawer .dclose:hover{background:var(--gray-2)}
  .drawer .db{flex:1;overflow-y:auto;padding:20px 24px}
  .drawer .db::-webkit-scrollbar{width:8px}
  .drawer .db::-webkit-scrollbar-thumb{background:var(--gray-2);border-radius:6px;border:2px solid var(--surface)}
  .sec{margin-bottom:20px}
  .sec .lbl{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
  .sec .val{font-size:13px;color:var(--ink);line-height:1.6}
  .sec .val.mut{color:var(--ink-2)}
  .rawbox{background:var(--surface-2);border:1px solid var(--border);border-left:2px solid var(--sage);border-radius:8px;padding:11px 13px;font-size:12px;color:var(--ink-2);line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow-y:auto}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;color:var(--sage-deep);background:var(--sage-soft);padding:3px 10px;border-radius:20px}
  .stbig{display:inline-block;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px}
  .stbig.acc{color:var(--sage-deep);background:var(--sage-soft)}
  .stbig.ign{color:var(--red);background:#f6e9e9}
  .stbig.pend{color:var(--ink-2);background:var(--gray)}
</style>
</head>
<body>
<div class="drag-strip"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2"/></svg></div>
      <div><div class="name">Claw</div><div class="sub">agent workspace</div></div>
    </div>
    <div class="nav-label">工作记忆</div>
    <div class="tab active" data-f="all"><span>全部</span><span class="cnt" id="c-all">0</span></div>
    <div class="tab" data-f="pending"><span>待处理</span><span class="cnt" id="c-pending">0</span></div>
    <div class="tab" data-f="accepted"><span>已采纳</span><span class="cnt" id="c-accepted">0</span></div>
    <div class="tab" data-f="ignored"><span>已忽略</span><span class="cnt" id="c-ignored">0</span></div>
    <div class="side-foot">
      <div class="ic" title="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke-linecap="round"/></svg></div>
      <div class="ic" title="帮助"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.8.4-1.4 1-1.4 2.2" stroke-linecap="round"/><circle cx="12" cy="17.2" r=".6" fill="currentColor" stroke="none"/></svg></div>
    </div>
  </aside>

  <section class="main">
    <div class="canvas">
      <div class="view-head"><h1 id="head-title">工作记忆</h1><p id="head-sub">从屏幕、对话与文档中安静捕获的上下文。</p></div>
      <div id="list"></div>
    </div>

    <div class="drawer" id="drawer">
      <div class="dh"><h2 id="d-title">—</h2><button class="dclose" id="d-close">✕</button></div>
      <div class="db" id="d-body"></div>
    </div>
  </section>
</div>

<script>
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtTime=(t)=>{if(!t)return'';const d=new Date(t);return isNaN(d)?'':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});};
  let filter='all';
  let selId=null;

  const HEAD={all:['工作记忆','从屏幕、对话与文档中安静捕获的上下文。'],pending:['待处理','尚未采纳或忽略的捕获。'],accepted:['已采纳','已加入 vault 的待办。'],ignored:['已忽略','你判定与自己无关的捕获。']};

  window.renderRecall=function(){
    const data=window.__RECALL__||[];
    // 计数
    const cnt={all:data.length,pending:0,accepted:0,ignored:0};
    data.forEach(d=>{ if(d.status==='accepted')cnt.accepted++; else if(d.status==='ignored')cnt.ignored++; else cnt.pending++; });
    for(const k of ['all','pending','accepted','ignored']) document.getElementById('c-'+k).textContent=cnt[k];
    // head
    document.getElementById('head-title').textContent=HEAD[filter][0];
    document.getElementById('head-sub').textContent=HEAD[filter][1];
    // 过滤
    let items=data;
    if(filter==='pending') items=data.filter(d=>!d.status);
    else if(filter==='accepted') items=data.filter(d=>d.status==='accepted');
    else if(filter==='ignored') items=data.filter(d=>d.status==='ignored');
    const list=document.getElementById('list');
    if(!items.length){list.innerHTML='<div class="empty">这里还没有内容。</div>';return;}
    list.innerHTML=items.map((it,i)=>{
      const idx=data.indexOf(it);
      const ctx=it.kind==='task'?'<span class="src">来源：</span>vault 日常/'+esc(it.file||''):(it.context?'<span class="src">来源：</span>'+esc(it.context):'');
      const st=it.status==='accepted'?'<span class="st acc">✓ 已采纳</span>':it.status==='ignored'?'<span class="st ign">✗ 已忽略</span>':'';
      const sel=(it.id&&it.id===selId)?' sel':'';
      return `<div class="card${sel}" data-idx="${idx}"><div class="ch"><div class="tt">${esc(it.title)}</div>${st}<div class="meta">${fmtTime(it.time)}</div></div><div class="ctx">${ctx}</div></div>`;
    }).join('');
    list.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openDetail(data[+c.dataset.idx])));
  };

  function openDetail(it){
    if(!it)return;
    selId=it.id||null;
    document.getElementById('d-title').textContent=it.title||'—';
    const stTxt=it.status==='accepted'?'<span class="stbig acc">✓ 已采纳</span>':it.status==='ignored'?'<span class="stbig ign">✗ 已忽略</span>':'<span class="stbig pend">待处理</span>';
    const apps=(it.apps&&it.apps.length)?it.apps:( it.tag?[it.tag]:[]);
    const parts=[];
    parts.push(`<div class="sec"><div class="lbl">状态</div><div class="val">${stTxt}</div></div>`);
    if(it.kind==='task') parts.push(`<div class="sec"><div class="lbl">来源</div><div class="val mut">vault 日常/${esc(it.file||'')}</div></div>`);
    else{
      if(apps.length) parts.push(`<div class="sec"><div class="lbl">来源</div><div class="chips">${apps.map(a=>'<span class="chip">'+esc(a)+'</span>').join('')}</div></div>`);
      if(it.reason) parts.push(`<div class="sec"><div class="lbl">判断理由</div><div class="val mut">${esc(it.reason)}</div></div>`);
      if(it.context) parts.push(`<div class="sec"><div class="lbl">触发片段</div><div class="val">${esc(it.context)}</div></div>`);
      if(it.raw) parts.push(`<div class="sec"><div class="lbl">原始上下文（触发时屏幕）</div><div class="rawbox">${esc(it.raw)}</div></div>`);
    }
    parts.push(`<div class="sec"><div class="lbl">时间</div><div class="val mut">${fmtTime(it.time)}</div></div>`);
    document.getElementById('d-body').innerHTML=parts.join('');
    document.getElementById('drawer').classList.add('open');
    window.renderRecall();
  }
  document.getElementById('d-close').addEventListener('click',()=>{document.getElementById('drawer').classList.remove('open');selId=null;window.renderRecall();});

  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    filter=t.dataset.f;
    window.renderRecall();
  }));

  if(window.__RECALL__) window.renderRecall();
</script>
</body>
</html>
